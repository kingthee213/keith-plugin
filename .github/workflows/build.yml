name: Build

on:
  push:
    branches: [main, editorial-redesign, w7-composition, mags-rebuild-and-levels]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS universal (VST3 + AU + app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap iPlug2
        run: ./tools/bootstrap-deps

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.7.10 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DIPLUG_DEPLOY_PLUGINS=OFF

      - name: Build VST3, AU and app
        run: cmake --build build --config Release --target MagsSynth-vst3 MagsSynth-au MagsSynth-app

      # The offline recreation render binary. measure_preset_levels.py drives this to render each
      # preset through the real engine and read its loudness, which is the only way a preset's
      # level trim can be measured rather than guessed. It was a CMake target that CI never built,
      # so nothing had ever been measured -- which is why the 190 new patches had no trims and
      # were not in the tables.
      - name: Build the offline preset renderer
        run: cmake --build build --config Release --target keith-recreation-render

      - name: Measure preset levels
        run: |
          # numpy and scipy, the measurement's only third-party dependencies:
          #   numpy  -- array maths for the K-weighting filter
          #   scipy  -- scipy.signal for the biquad
          # Checked against the imports in tools/measure_preset_levels.py rather than guessed at one
          # package at a time; numpy alone was installed first and the run then failed on scipy.
          #
          # This is the macOS runner's system Python, which is externally managed: a plain
          # `pip install` is REFUSED with a "use pipx or --break-system-packages" notice instead of
          # installing. --break-system-packages is right here because this is a throwaway CI
          # runner, not a user's machine, and it is scoped to this one step.
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages \
            numpy scipy

          # continue-on-error is deliberately NOT set on this step. It was, and it hid both
          # failures this step has had: a missing numpy and, before that, no renderer binary. A
          # step that reports success while writing nothing is worse than one that fails.
          # The renderer is a plain command-line binary with no bundle, so it cannot resolve the
          # sample kits the way the plugin does. KEITH_SAMPLE_DIR points it at them directly --
          # without it the renderer crashed on the first preset, because BundleResourcePath on
          # macOS hands a null path to +[NSString stringWithUTF8String:], which throws.
          export KEITH_SAMPLE_DIR="$PWD/resources/samples"
          python3 tools/measure_preset_levels.py measure \
            --render build/Release/keith-recreation-render \
            --out docs/level-measurements.tsv

          # Fail loudly if the measurement produced nothing, rather than letting the upload step
          # warn and the run go green.
          test -s docs/level-measurements.tsv || {
            echo "::error::the measurement produced no TSV"; exit 1; }
          wc -l docs/level-measurements.tsv

      - name: Upload level measurements
        uses: actions/upload-artifact@v4
        with:
          name: level-measurements
          path: docs/level-measurements.tsv
          if-no-files-found: error

      - name: Sign ad hoc and verify architectures
        run: |
          cd build/out/Release
          for bundle in MagsSynth.vst3 MagsSynth.component MagsSynth.app; do
            codesign --force --deep --sign - "$bundle"
            echo "$bundle  $(lipo -archs "$bundle/Contents/MacOS/MagsSynth")"
          done

      - name: Package
        run: |
          cd build/out/Release
          cat > README.txt <<'EOF'
          MAGS SYNTH demo build.

          VST3: copy MagsSynth.vst3 into ~/Library/Audio/Plug-Ins/VST3
          AU:   copy MagsSynth.component into ~/Library/Audio/Plug-Ins/Components
          Then restart the host, or rescan plug-ins. It shows as MAGS SYNTH, vendor Mags.
          No DAW needed at all: open MagsSynth.app and it runs standalone.

          The build is ad hoc signed rather than notarized, so macOS may warn on first
          load. Right click and Open, or allow it in System Settings, Privacy and Security.
          EOF
          zip -qry mags-synth-macos.zip MagsSynth.vst3 MagsSynth.component MagsSynth.app README.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mags-synth-macos
          path: build/out/Release/mags-synth-macos.zip
          # Not the default warn: this is the artifact that actually ships, and a green run with no
          # zip is the failure mode that hid the Windows path for several runs. Missing means fail.
          if-no-files-found: error

  build-windows:
    name: Windows x64 (VST3)
    runs-on: windows-latest
    # continue-on-error is REMOVED. It was here because Configure failed and the job could not
    # build; it now builds, so a red Windows job is a real signal again rather than noise. Leaving
    # the flag on would mean a future Windows break passed unnoticed, which is how this job stayed
    # broken long enough to accumulate four separate faults.
    #
    # The four, for the record, all in this turn's fixes: the MSVC developer environment was never
    # sourced, the VS generator was pinned to a version the runner no longer ships, the GCC-only
    # flags were passed to cl.exe, and CMP0091 was set after the targets existed so the runtime
    # library was ignored.
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap iPlug2
        shell: bash
        run: ./tools/bootstrap-deps

      # Two separate faults produced "could not find any instance of Visual Studio".
      #
      # First, the CMake VS generator needs the developer environment sourced in the shell.
      # ilammy/msvc-dev-cmd does that, and it worked -- vcvarsall.bat resolved afterwards.
      #
      # Second, the generator name was HARDCODED to "Visual Studio 17 2022" while the runner image
      # now ships VS 18. So the generator was looking for a version that is not installed. The
      # generator is discovered instead of named: cmake -G with no value lists what is available,
      # and the highest VS entry is used. That way a runner image change does not silently break
      # this again, which is exactly what happened here.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          GEN=$(cmake --help | grep -oE "Visual Studio 1[0-9]+ [0-9]+" | head -1)
          if [ -z "$GEN" ]; then
            echo "::error::no Visual Studio generator available"; exit 1
          fi
          echo "using generator: $GEN"
          cmake -S . -B build -G "$GEN" -A x64 -DIPLUG_DEPLOY_PLUGINS=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target MagsSynth-vst3

      # The VST3 lands at build/out/MagsSynth.vst3 -- there is no Release/ level on the Windows
      # side, unlike macOS. The old path was copied from the macOS job and never matched anything,
      # and upload-artifact only WARNED, so a green job was publishing nothing. The path assertions
      # below make that a failure instead.
      - name: Check the VST3 was built
        shell: bash
        run: |
          if [ ! -d build/out/MagsSynth.vst3 ]; then
            echo "::error::MagsSynth.vst3 is not at build/out -- the bundle layout changed"; exit 1
          fi
          find build/out/MagsSynth.vst3 -type f | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mags-synth-windows-vst3
          path: build/out/MagsSynth.vst3
          if-no-files-found: error
